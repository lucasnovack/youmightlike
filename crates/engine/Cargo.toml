[package]
name = "youmightlike-engine"
version = "0.1.0"
edition = "2021"
authors = ["lucasnvk"]
description = "High-performance graph diffusion engine for youmightlike"

[dependencies]
# Graph and Scientific Computing
petgraph = "0.6"
rayon = "1.10"

# DuckDB Local Storage
duckdb = { version = "1.1", features = ["bundled"] }

# Serialization, CLI and Web Server
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }

[[bin]]
name = "youmightlike-engine"
path = "src/main.rs"

[[bin]]
name = "youmightlike-server"
path = "src/bin/server.rs"

[[bin]]
name = "domain-report"
path = "src/bin/domain_report.rs"

