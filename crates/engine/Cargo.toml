[package]
name = "youmightlike-engine"
version = "0.1.0"
edition = "2021"
authors = ["lucasnvk"]
description = "High-performance graph diffusion engine for youmightlike"

[dependencies]
# Graph and Scientific Computing
petgraph = "0.6"
rayon = "1.10"

# DuckDB Local Storage
duckdb = { version = "1.1", features = ["bundled"] }

# Serialization and Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[[bin]]
name = "youmightlike-engine"
path = "src/main.rs"
