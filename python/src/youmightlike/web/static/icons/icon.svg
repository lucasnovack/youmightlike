<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#182825" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" />

  <!-- Constellation Connections -->
  <g stroke="#faf3dd" stroke-opacity="0.25" stroke-width="2.5" stroke-dasharray="4 4">
    <line x1="256" y1="256" x2="160" y2="140" />
    <line x1="256" y1="256" x2="360" y2="150" />
    <line x1="256" y1="256" x2="380" y2="350" />
    <line x1="256" y1="256" x2="150" y2="360" />
    <line x1="160" y1="140" x2="360" y2="150" />
    <line x1="360" y1="150" x2="380" y2="350" />
    <line x1="380" y1="350" x2="150" y2="360" />
  </g>

  <!-- Orbital Rings -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="#4e937a" stroke-opacity="0.3" stroke-width="1.5" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#e84855" stroke-opacity="0.4" stroke-width="2" />

  <!-- Peripheral Nodes -->
  <!-- Music (Teal/Sage) -->
  <circle cx="160" cy="140" r="18" fill="#4e937a" filter="url(#glow)" />
  <circle cx="160" cy="140" r="8" fill="#ffffff" />

  <!-- Movie (Amber/Coral) -->
  <circle cx="360" cy="150" r="22" fill="#d97706" filter="url(#glow)" />
  <circle cx="360" cy="150" r="10" fill="#ffffff" />

  <!-- Game (Steel Blue) -->
  <circle cx="380" cy="350" r="20" fill="#2563eb" filter="url(#glow)" />
  <circle cx="380" cy="350" r="9" fill="#ffffff" />

  <!-- Book (Purple/Slate) -->
  <circle cx="150" cy="360" r="16" fill="#7c3aed" filter="url(#glow)" />
  <circle cx="150" cy="360" r="7" fill="#ffffff" />

  <!-- Central Seed Node (Accent Coral / Ruby) -->
  <circle cx="256" cy="256" r="32" fill="#e84855" filter="url(#glow)" />
  <circle cx="256" cy="256" r="16" fill="#faf3dd" />
  <circle cx="256" cy="256" r="6" fill="#182825" />
</svg>
