[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youmightlike"
version = "0.1.0"
description = "Camada de Ingestão e Pipelines de Dados para o youmightlike"
readme = "../README.md"
requires-python = ">=3.11"
authors = [
    { name = "lucasnvk" }
]
dependencies = [
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
